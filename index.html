<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FEB Stats Lab</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#0E1116; --panel:#161B22; --panel-2:#1D2330; --line:#2A3140;
  --amber:#F2A93B; --amber-dim:#7A5A22; --crimson:#D6483F; --teal:#36C9B0;
  --ink:#ECEFF4; --ink-dim:#8B93A1; --court:#15301f;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px;}

.scoreboard{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#171C24,#11151B);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:22px;font-family:'IBM Plex Mono',monospace;flex-wrap:wrap;gap:8px;}
.sb-title{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:.08em;font-size:18px;color:var(--amber);text-transform:uppercase;}
.sb-steps{display:flex;gap:8px;font-size:11px;color:var(--ink-dim);letter-spacing:.05em;flex-wrap:wrap;}
.sb-step{padding:4px 9px;border:1px solid var(--line);border-radius:4px;background:none;color:var(--ink-dim);}
.sb-step:hover:not(.active){border-color:var(--amber);color:var(--amber);}
.sb-step.active{color:#0E1116;background:var(--amber);border-color:var(--amber);font-weight:600;}

h1.headline{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(26px,5vw,38px);margin:6px 0 4px;letter-spacing:-0.01em;}
.sub{color:var(--ink-dim);font-size:14px;margin-bottom:24px;line-height:1.5;}

.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:14px 16px;font-family:'Inter',sans-serif;font-size:14px;text-align:left;transition:border-color .15s,transform .1s;}
.btn:hover{border-color:var(--amber);transform:translateY(-1px);}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--ink-dim);background:none;border:none;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12.5px;margin-bottom:18px;padding:0;letter-spacing:.03em;}
.back-btn:hover{color:var(--amber);}

.grid{display:grid;gap:12px;}
.grid.leagues{grid-template-columns:repeat(2,1fr);}
.grid.mode{grid-template-columns:repeat(2,1fr);max-width:520px;}
.grid.list{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}

.league-card .tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--bg);background:var(--amber);padding:2px 7px;border-radius:3px;margin-bottom:8px;text-transform:uppercase;}
.league-card .tag.fem{background:var(--crimson);color:#fff;}
.league-card h3{font-family:'Oswald',sans-serif;font-size:19px;margin:0 0 4px;font-weight:600;}
.league-card p{margin:0;color:var(--ink-dim);font-size:12.5px;}

.mode-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:24px 18px;}
.mode-card .icon{font-size:26px;}
.mode-card h3{font-family:'Oswald',sans-serif;font-size:18px;margin:0;font-weight:600;}
.mode-card p{margin:0;color:var(--ink-dim);font-size:12.5px;}

.entity-card{display:flex;flex-direction:column;gap:6px;}
.entity-card .name{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;}
.entity-card .meta{font-size:11.5px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;}
.entity-card .badge{align-self:flex-start;font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--teal);border:1px solid var(--teal);padding:1px 6px;border-radius:3px;letter-spacing:.04em;}
.entity-card .real{color:var(--amber);border-color:var(--amber);}

.sheet{background:linear-gradient(180deg,var(--panel),#12161D);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.sheet-head{padding:22px 24px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(135deg,var(--court) 0 2px,#102718 2px 4px);position:relative;}
.sheet-head::before{content:"";position:absolute;inset:0;background:rgba(14,17,22,.78);}
.sheet-head > *{position:relative;}
.sheet-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--amber);letter-spacing:.08em;text-transform:uppercase;}
.sheet-name{font-family:'Oswald',sans-serif;font-size:clamp(22px,4vw,30px);font-weight:700;margin:4px 0;}
.sheet-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;}
.sheet-body{padding:22px 24px;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:22px;}
.stat-cell{background:var(--panel-2);padding:13px 10px;text-align:center;}
.stat-cell .val{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;color:var(--amber);}
.stat-cell .lab{font-size:10px;color:var(--ink-dim);letter-spacing:.03em;text-transform:uppercase;margin-top:3px;}

h4.section-title{font-family:'Oswald',sans-serif;font-size:13.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 10px;display:flex;align-items:center;gap:8px;}
h4.section-title::after{content:"";flex:1;height:1px;background:var(--line);}

.adv-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.adv-row:last-child{border-bottom:none;}
.adv-row .name{color:var(--ink-dim);}
.adv-row .bar-wrap{display:flex;align-items:center;gap:10px;width:52%;}
.bar{flex:1;height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--teal));}
.adv-row .num{font-family:'IBM Plex Mono',monospace;width:50px;text-align:right;color:var(--ink);flex-shrink:0;}

.chart-box{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:16px;margin:18px 0;}
.chart-box canvas{max-height:280px;}

.heatmap{overflow-x:auto;margin:14px 0;}
.heatmap table{border-collapse:collapse;width:100%;font-family:'IBM Plex Mono',monospace;font-size:11.5px;}
.heatmap th{text-align:left;color:var(--ink-dim);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
.heatmap td{padding:7px 9px;text-align:center;color:#0E1116;font-weight:600;white-space:nowrap;}
.heatmap td.teamname{text-align:left;color:var(--ink);font-weight:500;background:none !important;font-family:'Inter',sans-serif;}

.note{margin-top:16px;padding:12px 14px;border:1px dashed var(--amber-dim);border-radius:8px;font-size:11.5px;color:var(--ink-dim);line-height:1.55;}
.note b{color:var(--amber);}
.note.confirmed{border-color:var(--teal);}
.note.confirmed b{color:var(--teal);}

.footer-note{margin-top:36px;font-size:11.5px;color:var(--ink-dim);line-height:1.6;border-top:1px solid var(--line);padding-top:16px;}
.footer-note a{color:var(--amber);}

.bio-card{display:flex;gap:16px;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;}
.bio-photo{width:84px;height:84px;border-radius:10px;object-fit:cover;background:var(--panel-2);border:1px solid var(--line);flex-shrink:0;}
.bio-photo-fallback{width:84px;height:84px;border-radius:10px;background:linear-gradient(135deg,var(--panel-2),#232A38);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:26px;color:var(--ink-dim);flex-shrink:0;}
.bio-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 18px;flex:1;min-width:220px;}
.bio-item{font-size:12px;}
.bio-item .k{color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:2px;}
.bio-item .v{color:var(--ink);}
.bio-item .v.na{color:var(--ink-dim);font-style:italic;}

.metric-link{cursor:pointer;border-bottom:1px dotted var(--ink-dim);}
.metric-link:hover{color:var(--amber);border-bottom-color:var(--amber);}

.modal-overlay{position:fixed;inset:0;background:rgba(5,7,10,.72);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:420px;width:100%;padding:22px;position:relative;}
.modal-box h4{font-family:'Oswald',sans-serif;color:var(--amber);font-size:17px;margin:0 0 10px;}
.modal-box p{font-size:13.5px;line-height:1.55;color:var(--ink);margin:0;}
.modal-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--ink-dim);font-size:20px;cursor:pointer;line-height:1;}
.modal-close:hover{color:var(--amber);}

.compare-head{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-bottom:6px;}
.compare-head .vs{font-family:'Oswald',sans-serif;color:var(--ink-dim);font-size:13px;text-align:center;}
.compare-player-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;}
.compare-player-card .name{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;}
.compare-player-card .meta{font-size:11px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;}
table.compare-table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0;}
table.compare-table td, table.compare-table th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;}
table.compare-table th{color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.04em;}
table.compare-table td.metric-name{text-align:left;color:var(--ink-dim);font-size:12.5px;}
table.compare-table td.win{color:var(--teal);font-weight:700;font-family:'IBM Plex Mono',monospace;}
table.compare-table td.lose{color:var(--ink);font-family:'IBM Plex Mono',monospace;}
table.compare-table td.tie{color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;}

.vc-row{margin-bottom:16px;}
.vc-heads{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:6px;}
.vc-value{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;border-radius:8px;padding:8px 12px;text-align:center;background:var(--panel-2);border:1px solid var(--line);}
.vc-value.p1{color:var(--amber);}
.vc-value.p2{color:var(--crimson);}
.vc-value.win-glow{border-color:currentColor;}
.vc-label{font-family:'Oswald',sans-serif;font-size:12.5px;text-align:center;color:var(--ink-dim);letter-spacing:.01em;}
.vc-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--panel-2);}
.vc-bar .p1{background:var(--amber);}
.vc-bar .p2{background:var(--crimson);}
.vc-na{font-size:11.5px;color:var(--ink-dim);text-align:center;font-style:italic;padding:6px 0;}

.illustrative-tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--ink-dim);padding:2px 7px;border-radius:3px;margin-left:8px;vertical-align:middle;}

table.lineup-table{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0;}
table.lineup-table th{text-align:left;color:var(--ink-dim);font-weight:500;padding:7px 8px;border-bottom:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;}
table.lineup-table td{padding:8px;border-bottom:1px solid var(--line);}
table.lineup-table td.pos{color:var(--teal);font-family:'IBM Plex Mono',monospace;font-weight:600;}
table.lineup-table td.neg{color:var(--crimson);font-family:'IBM Plex Mono',monospace;font-weight:600;}

table.pm-table{width:100%;border-collapse:collapse;font-size:11.5px;margin:10px 0;font-family:'IBM Plex Mono',monospace;}
table.pm-table th{text-align:left;color:var(--ink-dim);font-weight:500;padding:6px 7px;border-bottom:1px solid var(--line);font-size:10px;text-transform:uppercase;}
table.pm-table td{padding:6px 7px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.pm-table td.pname{font-family:'Inter',sans-serif;white-space:normal;}
table.pm-table td.pm-pos{color:var(--teal);font-weight:600;}
table.pm-table td.pm-neg{color:var(--crimson);font-weight:600;}

@media (max-width:560px){
  .grid.leagues{grid-template-columns:1fr;}
  .grid.mode{grid-template-columns:1fr;}
}

.pdf-btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--amber);color:var(--amber);border-radius:8px;padding:8px 14px;font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;margin-left:auto;}
.pdf-btn:hover{background:var(--amber);color:var(--bg);}
.sheet-head-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}

@media print{
  :root{
    --bg:#ffffff; --panel:#ffffff; --panel-2:#f4f4f4; --line:#ccc;
    --ink:#111111; --ink-dim:#444444; --amber:#a05a00; --teal:#0e7c66; --crimson:#a3231d; --court:#eef6ee;
  }
  body{background:#fff;}
  .wrap{max-width:100%;padding:0;}
  .scoreboard, .back-btn, .no-print, #compareBar, #playerSearch, #compareToggle{display:none !important;}
  .sheet{border:1px solid #ccc;}
  .sheet-head{background:#f4f4f4;}
  .sheet-head::before{display:none;}
  .chart-box{break-inside:avoid;}
  .adv-row, .stat-grid, table{break-inside:avoid;}
  a{color:inherit;text-decoration:none;}
  .metric-link{border-bottom:none;}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =======================================================================
   FEB STATS LAB — fuentes de datos:
   - baloncestoenvivo.feb.es (equipos, medias oficiales de la temporada
     2025/26 por partido: PT, T2, T3, TL, rebotes, asistencias, pérdidas...
     y rankings individuales de puntos)
   - feb.es (composición oficial de las 4 competiciones 2025/26)
   - proballers.com (contexto de plantillas/jugadores)
   Los 4 Factores de Dean Oliver de cada equipo están calculados a partir
   de esas medias oficiales reales (eFG%, TOV%, tasa de rebote ofensivo
   propio, FT Rate). Cuando el marcador dice "real", el dato de puntos por
   partido procede directamente del ranking oficial. El resto de variables
   de caja (minutos, tiros, pérdidas, robos...) de cada jugador son un
   perfil modelado de forma realista para poder calcular con fórmulas
   estándar las métricas avanzadas solicitadas (eFG%, TS%, USG%, ORtg/DRtg,
   Net Rating, PER, AST%, TRB%, TOV%) — se marcan como "aprox." porque no
   hay box-score jugador a jugador público en estas fuentes.
======================================================================= */

// ---- Contexto de liga para fórmulas de jugador (aprox., basado en las medias reales de equipo) ----
const LEAGUE_CTX = { pace: 71, teamFGM: 27, teamTRB: 64 };

function computeAdvanced(p){
  const pts = (p.fgm-p.tpm)*2 + p.tpm*3 + p.ftm;
  const fga = p.fga, fgm = p.fgm, tpm = p.tpm, ftm = p.ftm, fta = p.fta;
  const poss = fga + 0.44*fta + p.tov;
  const efg = fga ? ((fgm+0.5*tpm)/fga*100) : 0;
  const ts = (fga+fta) ? (pts/(2*(fga+0.44*fta))*100) : 0;
  const usg = Math.min(38, (poss*(200/5))/(p.min*LEAGUE_CTX.pace)*100);
  const tovPct = poss ? (p.tov/poss*100) : 0;
  const astPct = Math.max(2, 100*p.ast/(((p.min/40)*LEAGUE_CTX.teamFGM)-fgm));
  const trb = p.oreb+p.dreb;
  const trbPct = Math.min(45, 100*trb*40/(p.min*LEAGUE_CTX.teamTRB));
  const ortg = poss ? (pts/poss*100) : 0;
  const drtg = 109 - (p.stl+p.blk)*2.3 + p.tov*0.4;
  const netrtg = ortg-drtg;
  const per = ((pts + trb*1.1 + p.ast*1.5 + p.stl*2 + p.blk*1.8 - p.tov*1.2 - (fga-fgm)*0.6 - (fta-ftm)*0.35) / p.min) * 30;
  return {pts,efg,ts,usg,tovPct,astPct,trbPct,ortg,drtg,netrtg,per,trb};
}

// ---- Estadísticas por partido / por 40 minutos en pista / por 100 posesiones ----
// "Por partido" son las medias reales (o modeladas, según el jugador) tal cual están en la base de datos.
// "Por 40 min" reescala cada media multiplicándola por 40/minutos jugados de media.
// "Por 100 posesiones" reescala usando las posesiones individuales usadas por el jugador
// (fórmula estándar: FGA + 0,44×FTA + TOV), no las posesiones del equipo.
// PF (faltas cometidas) y faltas recibidas NO están disponibles en ninguna de las fuentes usadas
// para ningún jugador de la app, así que se muestran como "No disponible" en vez de inventarse.
const STAT_KEYS = ['pts','twoM','twoA','tpm','tpa','ftm','fta','oreb','dreb','treb','ast','stl','blk','tov','eff'];
function computeStatModes(p){
  const fgm=p.fgm, fga=p.fga, tpm=p.tpm, tpa=p.tpa, ftm=p.ftm, fta=p.fta;
  const twoM = fgm-tpm, twoA = fga-tpa;
  const pts = twoM*2 + tpm*3 + ftm;
  const oreb=p.oreb, dreb=p.dreb, treb=oreb+dreb;
  const ast=p.ast, stl=p.stl, blk=p.blk, tov=p.tov;
  const eff = pts + treb + ast + stl + blk - (fga-fgm) - (fta-ftm) - tov;
  const poss = fga + 0.44*fta + tov;
  const perGame = {pts,twoM,twoA,tpm,tpa,ftm,fta,oreb,dreb,treb,ast,stl,blk,tov,eff,
    twoPct: twoA?(twoM/twoA*100):0, tpPct: tpa?(tpm/tpa*100):0, ftPct: fta?(ftm/fta*100):0};
  const f40 = p.min>0 ? 40/p.min : 0;
  const f100 = poss>0 ? 100/poss : 0;
  const per40={}, per100={};
  STAT_KEYS.forEach(k=>{ per40[k]=perGame[k]*f40; per100[k]=perGame[k]*f100; });
  per40.twoPct=perGame.twoPct; per40.tpPct=perGame.tpPct; per40.ftPct=perGame.ftPct;
  per100.twoPct=perGame.twoPct; per100.tpPct=perGame.tpPct; per100.ftPct=perGame.ftPct;
  return {perGame, per40, per100, poss};
}

// Definición de filas para la tabla de estadísticas por modo (partido / 40 min / 100 pos.)
// El orden y el conjunto de categorías en "per100" sigue exactamente lo solicitado.
const STAT_MODE_ROWS = [
  {key:'pts', label:'Puntos (PTS)', kind:'num'},
  {key:'blk', label:'Tapones (BLK)', kind:'num'},
  {key:'pf', label:'Faltas cometidas (PF)', kind:'na'},
  {key:'stl', label:'Robos (STL)', kind:'num'},
  {key:'eff', label:'Eficiencia (Rating / Valoración)', kind:'num'},
  {key:'twoPct', label:'% Tiros de 2 (2P%)', kind:'pct'},
  {key:'tpPct', label:'% Tiros de 3 (3P%)', kind:'pct'},
  {key:'ftPct', label:'% Tiros libres (FT%)', kind:'pct'},
  {key:'dreb', label:'Rebotes defensivos (DREB)', kind:'num'},
  {key:'oreb', label:'Rebotes ofensivos (OREB)', kind:'num'},
  {key:'treb', label:'Rebotes totales (TRB)', kind:'num'},
  {key:'tov', label:'Pérdidas (TOV)', kind:'num'},
  {key:'ast', label:'Asistencias (AST)', kind:'num'},
  {key:'pfDrawn', label:'Faltas recibidas', kind:'na'},
  {key:'ftm', label:'Tiros libres anotados (FTM)', kind:'num'},
  {key:'fta', label:'Tiros libres intentados (FTA)', kind:'num'},
  {key:'tpm', label:'Triples anotados (3PM)', kind:'num'},
  {key:'tpa', label:'Triples intentados (3PA)', kind:'num'},
  {key:'twoM', label:'Tiros de 2 anotados (2PM)', kind:'num'},
  {key:'twoA', label:'Tiros de 2 intentados (2PA)', kind:'num'}
];
// Filas adicionales que solo tienen sentido en el modo "Por partido" (no se reescalan a 40 min / 100 pos.)
// %Victorias del equipo y el diferencial de puntos por jugador (+/-) no están disponibles en ninguna
// fuente usada para la mayoría de jugadores de la app (solo existe ese dato en un partido puntual
// documentado en la app), así que se muestran como "No disponible" en vez de inventarse.
const PERGAME_EXTRA_ROWS = [
  {key:'gp', label:'Partidos jugados (GP)'},
  {key:'mpg', label:'Minutos por partido (MIN)'},
  {key:'winPct', label:'% Victorias del equipo (%WIN)'},
  {key:'pointDiff', label:'Diferencial de puntos promedio (+/-)'}
];
// Si una foto no carga (p. ej. bloqueada por el navegador), se sustituye por las iniciales
function photoFail(img){
  const d=document.createElement('div'); d.textContent=img.dataset.ini||'';
  if(img.classList.contains('bio-photo')) d.className='bio-photo-fallback';
  else d.style.cssText="width:38px;height:38px;border-radius:8px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:13px;color:var(--ink-dim);flex-shrink:0;";
  img.replaceWith(d);
}

// ---- Partido real del equipo (box-score oficial feb.es) · temporada 2026/27 ----
function teamGameHTML(team, roster){
  const g=team.game, b=team.box; if(!g||!b) return '';

// ---- Generador de perfil de caja a partir de un PPG real confirmado ----
// Los puntos por partido (ppg) son reales (ranking oficial baloncestoenvivo.feb.es).
// El resto de variables de caja (tiros, minutos, rebotes, asistencias, robos, tapones, pérdidas)
// se generan con una heurística estándar y consistente para poder calcular las métricas avanzadas;
// no son cifras publicadas jugador a jugador por FEB.
function mkReal(name, team, pos, games, ppg){
  const ftm = ppg*0.18, restPts = ppg-ftm;
  const twoPtsPts = restPts*0.66, threePtsPts = restPts*0.34;
  const twoPM = twoPtsPts/2, threePM = threePtsPts/3;
  const twoPA = twoPM/0.50, threePA = threePM/0.34;
  const fta = ftm/0.78;
  return {
    real:true, name, team, pos:pos||'Jugador/a', nat:'', games, min: +(20+ppg*0.55).toFixed(1),
    fgm:+(twoPM+threePM).toFixed(2), fga:+(twoPA+threePA).toFixed(2), tpm:+threePM.toFixed(2), tpa:+threePA.toFixed(2),
    ftm:+ftm.toFixed(2), fta:+fta.toFixed(2),
    oreb:+(0.9+ppg*0.06).toFixed(1), dreb:+(1.8+ppg*0.13).toFixed(1),
    ast:+(1.2+ppg*0.11).toFixed(1), stl:+(0.6+ppg*0.03).toFixed(1), blk:+(0.15+ppg*0.015).toFixed(2),
    tov:+(0.9+ppg*0.07).toFixed(1)
  };
}

// ---- Constructor flexible para jugadores "líder" de una estadística concreta (no siempre puntos) ----
// Se usa cuando la fuente solo confirma UNA categoría (p.ej. rebotes o asistencias líderes de la liga)
// en vez de un box-score completo. realStats indica qué campos son reales; el resto se estima con
// una heurística a partir del propio dato real conocido, para poder calcular las métricas avanzadas.
function mkRealLeader(name, team, pos, opts){
  const pts = opts.pts!==undefined ? opts.pts : (opts.reb!==undefined ? 5+opts.reb*0.7 : opts.ast!==undefined ? 6+opts.ast*0.8 : 8);
  const reb = opts.reb!==undefined ? opts.reb : 2+pts*0.12;
  const ast = opts.ast!==undefined ? opts.ast : 1+pts*0.08;
  const stl = opts.stl!==undefined ? opts.stl : 0.6+pts*0.03;
  const blk = opts.blk!==undefined ? opts.blk : 0.2+pts*0.02;
  const base = mkReal(name, team, pos, opts.games||null, pts);
  base.oreb = +(reb*0.3).toFixed(1); base.dreb = +(reb*0.7).toFixed(1);
  base.ast = +ast.toFixed(1); base.stl = +stl.toFixed(1); base.blk = +blk.toFixed(2);
  base.realStats = Object.keys(opts).filter(k=>k!=='games');
  return base;
}

// ---- Media de liga (jugadores): calculada dinámicamente sobre los jugadores cargados de cada liga ----
// ---- Media winsorizada ----
// Recorta los valores extremos (por debajo del percentil p y por encima del 100-p) al propio
// límite del percentil antes de calcular la media, para que un dato atípico (p.ej. un jugador con
// muy pocos minutos o un partido puntual con cifras disparadas) no distorsione la media del grupo.
function winsorize(arr, trimPct=0.1){
  if(!arr.length) return [];
  const sorted=[...arr].sort((a,b)=>a-b);
  const n=sorted.length;
  const lowIdx=Math.floor(n*trimPct);
  const highIdx=Math.min(n-1, Math.ceil(n*(1-trimPct))-1);
  const lowVal=sorted[Math.max(0,lowIdx)];
  const highVal=sorted[Math.max(0,highIdx)];
  return arr.map(v=> v<lowVal?lowVal : v>highVal?highVal : v);
}
function winsorizedMean(arr, trimPct=0.1){
  if(!arr.length) return 0;
  const w=winsorize(arr, trimPct);
  return w.reduce((s,v)=>s+v,0)/w.length;
}

function leaguePlayerAvg(players){
  const advs = players.map(computeAdvanced);
  const wm = (arr)=>winsorizedMean(arr, 0.1);
  return {
    pts: wm(advs.map(a=>a.pts)), trb: wm(advs.map(a=>a.trb)),
    ast: wm(players.map(p=>p.ast)), stl: wm(players.map(p=>p.stl)),
    efg: wm(advs.map(a=>a.efg)), ts: wm(advs.map(a=>a.ts)), usg: wm(advs.map(a=>a.usg)), astPct: wm(advs.map(a=>a.astPct)),
    trbPct: wm(advs.map(a=>a.trbPct)), tovPct: wm(advs.map(a=>a.tovPct)), ortg: wm(advs.map(a=>a.ortg)), drtg: wm(advs.map(a=>a.drtg)), per: wm(advs.map(a=>a.per))
  };
}

// Media de liga de los 4 Factores, calculada como media aritmética simple a partir de los equipos con datos reales
// (la media winsorizada solo se aplica a las estadísticas de jugadores, no de equipos)
function leagueAvgFFComputed(teams){
  const withFF = teams.filter(t=>t.ff);
  if(!withFF.length) return null;
  const plainMean = (arr)=> arr.reduce((s,v)=>s+v,0)/arr.length;
  return {
    efg: plainMean(withFF.map(t=>t.ff.efg)),
    tov: plainMean(withFF.map(t=>t.ff.tov)),
    orb: plainMean(withFF.map(t=>t.ff.orb)),
    ftr: plainMean(withFF.map(t=>t.ff.ftr))
  };
}

// Media de los jugadores que ocupan la misma posición (real u estimada, ver nota en la ficha)
function positionAvg(players, pos){
  const group = players.filter(p=>p.pos===pos);
  if(!group.length) return null;
  return {n:group.length, ...leaguePlayerAvg(group)};
}

// ---- Convierte una fila real de proballers.com (medias de temporada) en un jugador completo ----
// Datos reales: pts, reb, ast, partidos jugados, minutos, %3P, %TC, %TL, rebotes ofensivos, robos, pérdidas, tapones.
// Como la fuente da porcentajes de tiro pero no el desglose exacto de intentos de 2/3, los intentos (fga/tpa)
// se reconstruyen matemáticamente a partir de esos % reales para que sean internamente consistentes.
function realFromRow(name, team, pts, reb, ast, games, min, tpPctRaw, fgPctRaw, ftPctRaw, oreb, stl, tov, blk){
  const fgPct = fgPctRaw/100, tpPct = (tpPctRaw||0)/100, ftPct = (ftPctRaw||0)/100;
  const ftm = pts*0.18;
  const fta = ftPct>0 ? ftm/ftPct : (ftm>0 ? ftm/0.7 : 0);
  const tpShare = tpPct>0.001 ? 0.32 : 0.03;
  const remainPts = Math.max(0, pts-ftm);
  const denom = 2*fgPct + tpShare*tpPct;
  const fga = denom>0 ? remainPts/denom : pts/2;
  const tpa = fga*tpShare;
  const tpm = tpa*tpPct;
  const fgm = fga*fgPct;
  return {
    real:true, name, team, pos:'Jugador/a', nat:'', games, min,
    fgm:+fgm.toFixed(2), fga:+fga.toFixed(2), tpm:+tpm.toFixed(2), tpa:+tpa.toFixed(2),
    ftm:+ftm.toFixed(2), fta:+fta.toFixed(2),
    oreb:+oreb.toFixed(2), dreb:+Math.max(0,reb-oreb).toFixed(2),
    ast:+ast.toFixed(2), stl:+stl.toFixed(2), blk:+blk.toFixed(2), tov:+tov.toFixed(2)
  };
}

// ---- Clasificador de posición (ESTIMADO cuando no hay posición oficial confirmada) ----
// Heurística real basada en altura y perfil de rebotes/asistencias del propio jugador (no inventa datos,
// pero es una aproximación, no la posición oficial de la ficha del club).
function estimatePosition(heightCm, ast, reb){
  const h = heightCm || 195;
  if(ast >= 4) return 'Base';
  if(h >= 205 || reb >= 6) return 'Pívot';
  if(h >= 198) return 'Ala-Pívot';
  if(ast >= 2.3) return 'Base';
  if(h <= 190 && reb < 3) return 'Escolta';
  return 'Alero';
}

function teamLogo(teamName){
  // Equipos 2026/27: escudo oficial de la FEB (imagenes.feb.es) usando el id de equipo de feb.es
  if(typeof LEAGUES!=='undefined' && LEAGUES===LEAGUES_2026_2027){
    const t26 = LEAGUES_2026_2027.primera_feb.teams.find(t=>t.name===teamName);
    if(t26 && t26.febId) return `https://imagenes.feb.es/Imagen.aspx?i=${t26.febId}&ti=1`;
  }
  const id = TEAM_LOGOS[teamName];
  return id ? `https://www.proballers.com/api/getTeamLogo?id=${id}&width=100` : null;
}
// Escudo de equipo con fallback automático a iniciales si la imagen no carga
// (proballers.com puede bloquear la carga directa de la imagen desde otro dominio - protección de hotlinking)
function teamLogoFail(img){
  const n=img.dataset.team||''; const ini=n.split(' ').filter(w=>w.length>2).slice(0,2).map(w=>w[0]).join('').toUpperCase()||n.slice(0,2).toUpperCase();
  const d=document.createElement('div'); d.className='bio-photo-fallback'; d.textContent=ini;
  d.style.cssText='width:56px;height:56px;font-size:20px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;';
  img.replaceWith(d);
}
function teamBadgeHTML(teamName, size){
  const logo = teamLogo(teamName);
  const initials = teamName.split(' ').filter(w=>w.length>2).slice(0,2).map(w=>w[0]).join('').toUpperCase() || teamName.slice(0,2).toUpperCase();
  const fontSize = Math.round(size*0.36);
  if(!logo){
    return `<div class="bio-photo-fallback" style="width:${size}px;height:${size}px;font-size:${fontSize}px;border-radius:8px;flex-shrink:0;">${initials}</div>`;
  }
  return `<span style="display:inline-flex;position:relative;width:${size}px;height:${size}px;flex-shrink:0;">
    <img src="${logo}" alt="" style="width:${size}px;height:${size}px;object-fit:contain;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
    <div class="bio-photo-fallback" style="display:none;position:absolute;inset:0;width:${size}px;height:${size}px;font-size:${fontSize}px;border-radius:8px;align-items:center;justify-content:center;">${initials}</div>
  </span>`;
}

function attachBio(p){
  const full = BIO_FULL[p.name];
  const hw = BIO_HW[p.name];
  const h = full ? full.h : (hw ? hw.h : null);
  const a = hw ? hw.a : null;
  p.height = h; p.age = a;
  p.weight = full ? (full.w||null) : null;
  p.photo = full ? full.photo : null;
  p.birth = full ? full.birth : null;
  p.birthplace = full ? full.birthplace : null;
  p.nat = full ? full.nat : (p.nat || '');
  p.bioReal = !!full;
  const reb = (p.oreb||0)+(p.dreb||0);
  p.pos = full ? full.pos : estimatePosition(h, p.ast, reb);
  p.posReal = !!full;
  return p;
}

function screenLock(){
  const div=document.createElement('div');
  div.style.maxWidth='380px'; div.style.margin='60px auto 0';
  div.innerHTML=`
    <div style="text-align:center;margin-bottom:22px;">
      <div style="font-size:34px;margin-bottom:10px;">🔒</div>
      <h1 class="headline" style="font-size:24px;">Acceso privado</h1>
      <p class="sub">Introduce la clave de acceso para entrar en FEB Stats Lab.</p>
    </div>
    <input id="lockInput" type="password" placeholder="Contraseña" style="width:100%;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;outline:none;text-align:center;margin-bottom:10px;">
    <div id="lockError" style="color:var(--crimson);font-size:12.5px;text-align:center;min-height:18px;margin-bottom:10px;"></div>
    <button id="lockSubmit" class="btn" style="width:100%;text-align:center;border-color:var(--amber);color:var(--amber);">Entrar</button>
    <div class="note" style="margin-top:20px;"><b>Nota:</b> esta es una clave de acceso básica del lado del cliente, pensada solo para evitar entradas accidentales — no es seguridad real, ya que al ser una app HTML de un solo archivo, cualquiera con acceso al código fuente puede ver la contraseña y los datos. No la uses para proteger información sensible.</div>
    <div style="text-align:center;margin-top:24px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);">Creado por Dani Piña. Fuentes: www.feb.es</div>
  `;
  setTimeout(()=>{
    const input=document.getElementById('lockInput');
    const err=document.getElementById('lockError');
    const submit=document.getElementById('lockSubmit');
    function tryUnlock(){
      const val=(input.value||'').trim().toLowerCase();
      if(val === ACCESS_PASSWORD){
        state.unlocked = true; state.appMode='feb'; render();
      } else if(val === ALT_ACCESS_PASSWORD){
        state.unlocked = true; state.appMode='maristas'; render();
      } else {
        err.textContent = 'Contraseña incorrecta. Inténtalo de nuevo.';
        input.value=''; input.focus();
      }
    }
    submit.onclick = tryUnlock;
    input.onkeydown = (e)=>{ if(e.key==='Enter') tryUnlock(); };
    input.focus();
  },0);
  return div;
}

function screenMaristas(){
  const div=document.createElement('div');

  setTimeout(()=>{

}

function destroyCharts(){ chartRefs.forEach(c=>c.destroy()); chartRefs=[]; }

function resetToLeagues(){ state.leagueKey=null; state.mode=null; state.entity=null; state.compareMode=false; state.compareSel=[]; state.teamCompareMode=false; state.teamCompareSel=[]; state.rankMetric='pts'; }

function render(){
  destroyCharts();
  const app = document.getElementById('app');
  app.innerHTML='';
  if(!state.unlocked){ app.appendChild(screenLock()); return; }
  if(state.appMode==='maristas'){ app.appendChild(screenMaristas()); return; }
  app.appendChild(scoreboard());
  if(!state.season){ app.appendChild(screenSeason()); return; }
  if(!SEASONS_WITH_DATA.includes(state.season)){ app.appendChild(screenNoSeasonData()); return; }
  if(!state.leagueKey){ app.appendChild(screenLeagues()); return; }
  if(!state.mode){ app.appendChild(screenMode()); return; }
  if(state.mode==='graficos'){ app.appendChild(screenGraphs()); app.appendChild(footerNote()); return; }
  if(state.entity && state.entity.type==='compare'){ app.appendChild(screenCompare()); app.appendChild(footerNote()); return; }
  if(state.entity && state.entity.type==='compareTeams'){ app.appendChild(screenCompareTeams()); app.appendChild(footerNote()); return; }
  if(state.entity && state.entity.type==='filters'){ app.appendChild(screenFilters()); app.appendChild(footerNote()); return; }
  if(!state.entity){ app.appendChild(screenList()); return; }
  app.appendChild(screenDetail());
  app.appendChild(footerNote());
}

function screenSeason(){
  const div=document.createElement('div');
  div.innerHTML=`<h1 class="headline">FEB Stats Lab</h1><p class="sub">Elige la temporada que quieres consultar.</p>`;

  const mainBtn=document.createElement('button');
  mainBtn.className='btn league-card';
  mainBtn.style.width='100%'; mainBtn.style.marginBottom='12px';
  mainBtn.innerHTML=`<span class="tag">Temporada actual</span><h3>Temporada 2026-2027</h3><p>Competiciones FEB en curso.</p>`;
  mainBtn.onclick=()=>{ state.season='2026-2027'; setActiveSeason(state.season); resetToLeagues(); render(); };
  div.appendChild(mainBtn);

  const prevBtn=document.createElement('button');
  prevBtn.className='btn';
  prevBtn.style.width='100%';
  prevBtn.innerHTML=`⏮ Temporadas anteriores`;
  prevBtn.onclick=()=>{ state.seasonMenuOpen = !state.seasonMenuOpen; render(); };
  div.appendChild(prevBtn);

  if(state.seasonMenuOpen){
    const grid=document.createElement('div'); grid.className='grid'; grid.style.gridTemplateColumns='1fr'; grid.style.marginTop='12px';
    ['2025-2026'].forEach(s=>{
      const b=document.createElement('button'); b.className='btn entity-card';
      const hasData = SEASONS_WITH_DATA.includes(s);
      b.innerHTML=`<span class="badge ${hasData?'real':''}">${hasData?'Datos disponibles':'Sin datos aún'}</span><span class="name">${s}</span>`;
      b.onclick=()=>{ state.season=s; setActiveSeason(state.season); resetToLeagues(); render(); };
      grid.appendChild(b);
    });
    div.appendChild(grid);
  }
  return div;
}

function screenNoSeasonData(){
  const div=document.createElement('div');
  div.appendChild(backBtn(()=>{state.season=null; state.seasonMenuOpen=false; render();},'← Cambiar temporada'));
  div.innerHTML+=`<h1 class="headline">Temporada ${state.season}</h1>`;
  const note=document.createElement('div'); note.className='note';
  note.innerHTML = state.season==='2026-2027'
    ? `<b>Nota:</b> la temporada 2026/27 todavía no ha comenzado (o está en pretemporada) en las fuentes usadas por esta app, así que no hay estadísticas reales que mostrar todavía. La temporada más reciente con datos completos es <b>2025-2026</b>, disponible en "Temporadas anteriores".`
    : `<b>Nota:</b> esta versión de la app no tiene cargados datos de la temporada ${state.season}. Solo la temporada 2025-2026 está disponible por ahora.`;
  div.appendChild(note);
  return div;
}

function scoreboard(){
  const div=document.createElement('div'); div.className='scoreboard';
  const idx=!state.season?0: !state.leagueKey?1: !state.mode?2: !state.entity?3:4;
  const steps=[
    {label:'Temporada', go:()=>{state.season=null; state.seasonMenuOpen=false; resetToLeagues(); render();}},
    {label:'Liga', go:()=>{resetToLeagues(); render();}},
    {label:'Modo', go:()=>{state.mode=null; state.entity=null; state.compareMode=false; state.compareSel=[]; state.teamCompareMode=false; state.teamCompareSel=[]; render();}},
    {label:'Selección', go:()=>{state.entity=null; render();}},

// Paleta de colores para diferenciar equipos en el gráfico de burbujas (asignación estable por nombre)
const BUBBLE_PALETTE = ['#F2A93B','#36C9B0','#D6483F','#2F8FE0','#A855F7','#F472B6','#84CC16','#FB923C','#22D3EE','#EAB308','#EC4899','#10B981','#8B5CF6','#F97316','#06B6D4','#EF4444','#65D6A0','#FDE047','#C084FC','#FCA5A5','#5EEAD4','#FDBA74','#93C5FD','#D9F99D','#F9A8D4','#67E8F9','#FCD34D','#C4B5FD'];
function colorForTeam(teamName){
  let h=0; for(let i=0;i<teamName.length;i++){ h=(h*31+teamName.charCodeAt(i))>>>0; }
  return BUBBLE_PALETTE[h % BUBBLE_PALETTE.length];
}
function renderBubbleChart(players, xKey, yKey){
  const mx=GRAPH_METRICS.find(m=>m.key===xKey), my=GRAPH_METRICS.find(m=>m.key===yKey);
  const noteEl=document.getElementById('graphNote');
  const wrapEl=document.getElementById('graphChartWrap');
  const xAvail = graphMetricAvailable(mx, players), yAvail = graphMetricAvailable(my, players);
  if(!xAvail || !yAvail){
    wrapEl.style.display='none';
    const missing = [!xAvail?mx.label:null, !yAvail?my.label:null].filter(Boolean).join(' y ');
    noteEl.innerHTML = `<div class="note">La métrica <b>${missing}</b> no está disponible en ninguna fuente usada para los jugadores/as de esta liga, así que no se puede dibujar el gráfico con ese eje. Elige otra métrica.</div>`;
    return;
  }
  wrapEl.style.display='block';
  noteEl.innerHTML = `<div class="note">Cada burbuja es un jugador/a real de la liga, coloreada por equipo para diferenciarlas. Tamaño de la burbuja = minutos por partido (a menor tamaño, menos solapamiento). Usa los botones de lupa para acercar o alejar y separar visualmente burbujas muy juntas. Pasa el ratón por encima para ver el nombre.</div>`;
  const pts = players.filter(p=>{
    const xv = mx.get(p), yv = my.get(p);
    return xv!=null && yv!=null && !isNaN(xv) && !isNaN(yv);
  }).map(p=>({x:mx.get(p), y:my.get(p), r:Math.max(3,Math.min(13,(p.min||10)/3.2)), name:p.name, team:p.team}));
  const bgColors = pts.map(d=>colorForTeam(d.team)+'B3'); // ~70% opacidad
  const borderColors = pts.map(d=>colorForTeam(d.team));

  // Rango real de los datos (permite negativos, p.ej. una eficiencia negativa) con un margen del 10%
  const xs = pts.map(d=>d.x), ys = pts.map(d=>d.y);
  const xMinD = Math.min(...xs), xMaxD = Math.max(...xs), yMinD = Math.min(...ys), yMaxD = Math.max(...ys);
  const xPad = Math.max((xMaxD-xMinD)*0.12, 0.5), yPad = Math.max((yMaxD-yMinD)*0.12, 0.5);
  const fullRange = { xMin:xMinD-xPad, xMax:xMaxD+xPad, yMin:yMinD-yPad, yMax:yMaxD+yPad };

  const wrapCanvas = document.getElementById('bubbleChart');
  const existing = Chart.getChart(wrapCanvas);
  if(existing) existing.destroy();
  const newChart = new Chart(wrapCanvas,{
    type:'bubble',
    data:{ datasets:[{ label:`${mx.label} vs ${my.label}`, data:pts, backgroundColor:bgColors, borderColor:borderColors, borderWidth:1.5, hoverBorderWidth:2.5, hoverBorderColor:'#ECEFF4' }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{ callbacks:{ label:(ctx)=>{ const d=ctx.raw; return `${d.name} (${d.team}): ${mx.label} ${d.x.toFixed(1)}, ${my.label} ${d.y.toFixed(1)}`; } } }
      },
      scales:{
        x:{ min:fullRange.xMin, max:fullRange.xMax, title:{display:true,text:mx.label,color:'#8B93A1'}, ticks:{color:'#8B93A1'}, grid:{color:'#1D2330'} },
        y:{ min:fullRange.yMin, max:fullRange.yMax, title:{display:true,text:my.label,color:'#8B93A1'}, ticks:{color:'#8B93A1'}, grid:{color:'#1D2330'} }
      }
    }
  });
  newChart.__fullRange = fullRange; // guardado para poder "Restablecer zoom"
  chartRefs.push(newChart);
}

// ---- Zoom manual del gráfico de burbujas (sin depender de plugins externos) ----
// factor < 1 acerca (achica el rango visible); factor > 1 aleja (agranda el rango visible).
// El zoom se centra en el punto medio del rango actualmente visible.
function zoomBubbleChart(factor){
  const canvas=document.getElementById('bubbleChart');
  const chart=canvas && Chart.getChart(canvas);
  if(!chart) return;
  const xScale=chart.scales.x, yScale=chart.scales.y;
  const xMid=(xScale.min+xScale.max)/2, yMid=(yScale.min+yScale.max)/2;
  const xHalf=(xScale.max-xScale.min)/2*factor, yHalf=(yScale.max-yScale.min)/2*factor;
  // límite: no permitir un rango absurdamente pequeño (evita zoom infinito) ni mayor a 4x el rango original
  const fr=chart.__fullRange;
  const minSpanX=(fr.xMax-fr.xMin)*0.03, minSpanY=(fr.yMax-fr.yMin)*0.03;
  const maxSpanX=(fr.xMax-fr.xMin)*4, maxSpanY=(fr.yMax-fr.yMin)*4;
  const newHalfX=Math.max(minSpanX/2, Math.min(maxSpanX/2, xHalf));
  const newHalfY=Math.max(minSpanY/2, Math.min(maxSpanY/2, yHalf));
  chart.options.scales.x.min=xMid-newHalfX; chart.options.scales.x.max=xMid+newHalfX;
  chart.options.scales.y.min=yMid-newHalfY; chart.options.scales.y.max=yMid+newHalfY;
  chart.update();
}
function resetZoomBubbleChart(){
  const canvas=document.getElementById('bubbleChart');
  const chart=canvas && Chart.getChart(canvas);
  if(!chart || !chart.__fullRange) return;
  const fr=chart.__fullRange;
  chart.options.scales.x.min=fr.xMin; chart.options.scales.x.max=fr.xMax;
  chart.options.scales.y.min=fr.yMin; chart.options.scales.y.max=fr.yMax;
  chart.update();
}

// ---- Desplazamiento (paneo) del gráfico de burbujas tras hacer zoom ----
// fracX/fracY: cuánto se desplaza el centro de la vista, como fracción del rango visible actual
// (p.ej. 0.25 = un cuarto del ancho/alto visible hacia la derecha/arriba).
function panBubbleChart(fracX, fracY){
  const canvas=document.getElementById('bubbleChart');
  const chart=canvas && Chart.getChart(canvas);
  if(!chart) return;
  const xScale=chart.scales.x, yScale=chart.scales.y;
  const spanX=xScale.max-xScale.min, spanY=yScale.max-yScale.min;
  const dx=spanX*fracX, dy=spanY*fracY;
  chart.options.scales.x.min+=dx; chart.options.scales.x.max+=dx;
  chart.options.scales.y.min+=dy; chart.options.scales.y.max+=dy;
  chart.update('none');
}

// Arrastrar con ratón o dedo directamente sobre el gráfico para moverse libremente por él
// (usa las propias escalas de Chart.js para convertir píxeles arrastrados en unidades de cada eje).
function setupBubbleChartDrag(){
  const canvas=document.getElementById('bubbleChart');
  if(!canvas) return;
  let dragging=false, lastX=0, lastY=0;
  const wrapper = canvas.parentElement;
  function start(clientX, clientY){
    dragging=true; lastX=clientX; lastY=clientY;
    if(wrapper) wrapper.style.cursor='grabbing';
  }
  function move(clientX, clientY){
    if(!dragging) return;
    const chart=Chart.getChart(canvas);
    if(!chart) return;
    const xScale=chart.scales.x, yScale=chart.scales.y;
    const dxPix = clientX-lastX, dyPix = clientY-lastY;
    const dxVal = (xScale.getValueForPixel(0)-xScale.getValueForPixel(dxPix));
    const dyVal = (yScale.getValueForPixel(0)-yScale.getValueForPixel(dyPix));
    chart.options.scales.x.min-=dxVal; chart.options.scales.x.max-=dxVal;
    chart.options.scales.y.min-=dyVal; chart.options.scales.y.max-=dyVal;
    chart.update('none');
    lastX=clientX; lastY=clientY;
  }
  function end(){ dragging=false; if(wrapper) wrapper.style.cursor='grab'; }
  canvas.onmousedown=(e)=>{ start(e.clientX,e.clientY); e.preventDefault(); };
  canvas.onmousemove=(e)=>{ if(dragging) move(e.clientX,e.clientY); };
  canvas.onmouseup=end; canvas.onmouseleave=end;
  canvas.ontouchstart=(e)=>{ if(e.touches.length===1){ start(e.touches[0].clientX,e.touches[0].clientY); } };
  canvas.ontouchmove=(e)=>{ if(dragging && e.touches.length===1){ move(e.touches[0].clientX,e.touches[0].clientY); e.preventDefault(); } };
  canvas.ontouchend=end; canvas.ontouchcancel=end;
}

function ffColor(val,type){
  // devuelve color de fondo para heatmap (verde=mejor, rojo=peor) según el tipo de métrica
  const good = type==='tov' ? (100-val) : val; // menos pérdidas es mejor
  const scales = {efg:[35,60], tov:[60,90] /*ya invertido*/, orb:[15,40], ftr:[10,42]};
  const [lo,hi] = type==='tov' ? [10,40] : scales[type];
  let pct;
  if(type==='tov'){ pct = 1-((val-lo)/(hi-lo)); } else { pct = (val-lo)/(hi-lo); }
  pct = Math.max(0,Math.min(1,pct));
  const hue = 4 + pct*130; // rojo -> verde
  return `hsl(${hue},60%,42%)`;
}

function heatmapTable(teams){
  const rows = teams.filter(t=>t.ff);
  if(!rows.length) return '<div class="note">Todavía no hay datos de los 4 Factores confirmados para los equipos de esta liga en esta versión.</div>';
  let html = `<div class="heatmap"><table><thead><tr><th>Equipo</th><th>${metricLabel('eFG% (equipo)','eFG%')}</th><th>${metricLabel('TOV% (equipo)','TOV%')}</th><th>${metricLabel('ORB%','ORB%*')}</th><th>${metricLabel('FT Rate')}</th><th>PJ</th></tr></thead><tbody>`;
  rows.sort((a,b)=>b.ff.efg-a.ff.efg).forEach(t=>{
    html+=`<tr>
      <td class="teamname">${t.name}</td>
      <td style="background:${ffColor(t.ff.efg,'efg')}">${t.ff.efg.toFixed(1)}%</td>
      <td style="background:${ffColor(t.ff.tov,'tov')}">${t.ff.tov.toFixed(1)}%</td>
      <td style="background:${ffColor(t.ff.orb,'orb')}">${t.ff.orb.toFixed(1)}%</td>
      <td style="background:${ffColor(t.ff.ftr,'ftr')}">${t.ff.ftr.toFixed(1)}%</td>
      <td class="teamname">${t.ff.games}</td>
    </tr>`;
  });
  html+='</tbody></table></div><div class="note"><b>Mapa de calor:</b> verde = mejor valor relativo dentro de la muestra actual, rojo = peor. *ORB% aquí es una tasa de rebote ofensivo propio (OREB del equipo entre sus rebotes totales), no un ORB% ajustado al rival, porque esa granularidad no está publicada en abierto. Pincha el nombre de cualquier métrica de la cabecera para ver qué significa.</div>';
  return html;
}

// FEB no publica en abierto el play-by-play con sustituciones ni el +/- por combinación de 5 jugadores,
// así que esto es una simulación con fines demostrativos, no datos reales de quinteto.
// ---- Distribución de minutos por jugador (REAL, temporada 2025/26) ----
function minutesColor(min){
  if(min<8) return '#D6483F';       // rojo: <8
  if(min<=14) return '#E8590C';     // naranja: 9-14
  if(min<=19) return '#F0C419';     // amarillo: 15-19
  if(min<=25) return '#2F8FE0';     // azul: 20-25
  return '#3FB950';                 // verde: 26+
}
function minutesChartHTML(roster){
  if(!roster.length) return '<div class="note">Todavía no hay jugadores/as cargados de este club para mostrar la distribución de minutos.</div>';
  const withMin = roster.filter(p=>p.min);
  const avgMin = withMin.length ? withMin.reduce((s,p)=>s+p.min,0)/withMin.length : 0;
  const canvasWidth = Math.max(500, withMin.length*55);
  return `
    <div class="chart-box">
      <div style="text-align:center;margin-bottom:10px;">
        <span class="illustrative-tag" style="background:var(--amber);">Media del equipo: ${avgMin.toFixed(1)} min/partido</span>
      </div>
      <div style="overflow-x:auto;overflow-y:hidden;">
        <div style="width:${canvasWidth}px;height:340px;">
          <canvas id="minutesChart"></canvas>
        </div>
      </div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--ink-dim);">
        <span><i style="display:inline-block;width:10px;height:10px;background:#D6483F;border-radius:2px;margin-right:4px;"></i>&lt;8 min</span>

        <span><i style="display:inline-block;width:10px;height:10px;background:#F0C419;border-radius:2px;margin-right:4px;"></i>15-19 min</span>

      </div>

    </div>
  `;
}

function lineupsHTML(teamName, roster){
  const names = roster.length ? roster.map(p=>p.name) : ['Base (genérico)','Escolta (genérico)','Alero (genérico)','Ala-pívot (genérico)','Pívot (genérico)'];
  while(names.length<5) names.push(['Rotación A','Rotación B','Rotación C','Rotación D','Rotación E'][names.length]);
  // combinaciones simuladas deterministas (semilla en el nombre del equipo, para que sea estable)
  let seed = teamName.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  function rnd(){ seed = (seed*9301+49297)%233280; return seed/233280; }
  const combos = [];
  for(let i=0;i<4;i++){
    const shuffled = [...names].sort(()=>rnd()-0.5).slice(0,5);
    const net = ((rnd()*24)-10).toFixed(1);
    const minShare = (6+rnd()*9).toFixed(1);
    combos.push({five:shuffled, net, min:minShare});
  }
  combos.sort((a,b)=>b.net-a.net);
  let rows = combos.map(c=>`<tr><td>${c.five.join(', ')}</td><td>${c.min}%</td><td class="${c.net>=0?'pos':'neg'}">${c.net>=0?'+':''}${c.net}</td></tr>`).join('');
  return `<table class="lineup-table"><thead><tr><th>Quinteto (nombre y apellidos)</th><th>% min. jugados juntos</th><th>Net Rating</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="note"><b>Nota:</b> tabla <b>ilustrativa/simulada</b>. FEB no publica en abierto el play-by-play con marcas de sustitución ni el +/- por combinación de 5 jugadores en estas fuentes, así que no se puede calcular un Net Rating real por quinteto. Los nombres de los 5 jugadores de cada combinación sí son reales (de la plantilla cargada de este club); lo simulado es qué 5 concretos coinciden en pista y su Net Rating.</div>`;
}

function realGameHTML(g, focusTeam){
  const rows = g.players.filter(p=>p.team===focusTeam).map(p=>
    `<tr><td class="pname">${p.name}</td><td>${p.min}</td><td>${p.pts}</td><td>${p.fg} (${p.fgpct}%)</td><td>${p.reb}</td><td>${p.ast}</td><td>${p.stl}</td><td>${p.tov}</td><td class="${p.pm>=0?'pm-pos':'pm-neg'}">${p.pm>=0?'+':''}${p.pm}</td></tr>`
  ).join('');
  return `

}

const VISUAL_COMPARE_METRICS = [
  {key:'pts', label:'Puntos por partido'},
  {key:'tpm', label:'Triples anotados por partido (3GM)'},
  {key:'treb', label:'Rebotes por partido'},
  {key:'ast', label:'Asistencias por partido'},
  {key:'stl', label:'Robos por partido'},
  {key:'eff', label:'Eficiencia (rating) por partido'}
];
function visualCompareHTML(p1, p2){
  const m1 = computeStatModes(p1).perGame, m2 = computeStatModes(p2).perGame;
  const rows = VISUAL_COMPARE_METRICS.map(m=>{
    const v1=m1[m.key], v2=m2[m.key];
    const total = v1+v2;
    const w1 = total>0 ? (v1/total*100) : 50;
    const w2 = total>0 ? (v2/total*100) : 50;
    const p1wins = v1>v2, p2wins = v2>v1;
    return `<div class="vc-row">
      <div class="vc-heads">
        <div class="vc-value p1 ${p1wins?'win-glow':''}">${v1.toFixed(1)}</div>
        <div class="vc-label">${m.label}</div>
        <div class="vc-value p2 ${p2wins?'win-glow':''}">${v2.toFixed(1)}</div>
      </div>
      <div class="vc-bar"><div class="p1" style="width:${w1}%"></div><div class="p2" style="width:${w2}%"></div></div>
    </div>`;
  }).join('');
  return `${rows}
    <div class="vc-row">
      <div class="vc-heads">
        <div class="vc-value p1" style="opacity:.5;">—</div>
        <div class="vc-label">Diferencial de puntos promedio (+/-)</div>
        <div class="vc-value p2" style="opacity:.5;">—</div>
      </div>
      <div class="vc-na">No disponible para ningún jugador de la app (no hay fuente con el +/- por partido, salvo un único partido puntual documentado en otra sección).</div>
    </div>
    <div class="note"><b>Nota:</b> comparativa visual con las medias "por partido" de cada jugador/a (mismos datos que la tabla de arriba en modo "Por partido"), con el ganador de cada apartado resaltado.</div>`;
}

function statModeCompareTableHTML(p1, p2, mode){
  const m1 = computeStatModes(p1), m2 = computeStatModes(p2);
  const d1 = mode==='per40' ? m1.per40 : mode==='per100' ? m1.per100 : m1.perGame;
  const d2 = mode==='per40' ? m2.per40 : mode==='per100' ? m2.per100 : m2.perGame;
  const lowerIsBetter = new Set(['tov']);
  let extraRows = '';
  if(mode==='perGame' || mode==='per40'){
    extraRows = PERGAME_EXTRA_ROWS.map(r=>{
      if(r.key==='gp'){
        const v1=p1.games, v2=p2.games;
        if(v1==null || v2==null) return `<tr><td class="metric-name">${r.label}</td><td class="tie">${v1??'—'}</td><td class="tie">${v2??'—'}</td></tr>`;
        const c1 = v1>v2?'win':v1<v2?'lose':'tie', c2 = v2>v1?'win':v2<v1?'lose':'tie';
        return `<tr><td class="metric-name">${r.label}</td><td class="${c1}">${v1}</td><td class="${c2}">${v2}</td></tr>`;
      }
      if(r.key==='mpg'){
        const v1=p1.min, v2=p2.min;
        const c1 = v1>v2?'win':v1<v2?'lose':'tie', c2 = v2>v1?'win':v2<v1?'lose':'tie';
        return `<tr><td class="metric-name">${r.label}</td><td class="${c1}">${v1.toFixed(1)}</td><td class="${c2}">${v2.toFixed(1)}</td></tr>`;
      }
      return `<tr><td class="metric-name">${r.label}</td><td class="tie">—</td><td class="tie">—</td></tr>`;
    }).join('');
  }
  const rows = STAT_MODE_ROWS.map(r=>{
    if(r.kind==='na'){
      return `<tr><td class="metric-name">${r.label}</td><td class="tie">—</td><td class="tie">—</td></tr>`;
    }
    const v1=d1[r.key], v2=d2[r.key];
    let c1='tie', c2='tie';
    if(Math.abs(v1-v2)>0.05){
      const higherIsBetter = !lowerIsBetter.has(r.key);
      const p1wins = higherIsBetter ? v1>v2 : v1<v2;
      c1 = p1wins?'win':'lose'; c2 = p1wins?'lose':'win';
    }
    const suffix = r.kind==='pct' ? '%' : '';
    return `<tr><td class="metric-name">${r.label}</td><td class="${c1}">${v1.toFixed(1)}${suffix}</td><td class="${c2}">${v2.toFixed(1)}${suffix}</td></tr>`;
  }).join('');
  return `<table class="compare-table"><thead><tr><th>Estadística</th><th>${p1.name.split(' ')[0]}</th><th>${p2.name.split(' ')[0]}</th></tr></thead><tbody>${extraRows}${rows}</tbody></table>
    <div class="note"><b>Nota:</b> PF (faltas cometidas), faltas recibidas${(mode==='perGame'||mode==='per40')?', % de victorias del equipo y el diferencial de puntos (+/-)':''} no están disponibles para ningún jugador de la app. "Por 100 posesiones" usa las posesiones individuales de cada jugador (FGA + 0,44×FTA + TOV), no las del equipo.</div>`;
}

          </div>
        </div>
        <div class="note ${pl.bioReal?'confirmed':''}"><b>${pl.bioReal?'Dato real:':'Nota:'}</b> ${pl.bioReal?'Foto, nacimiento y nacionalidad proceden de la ficha oficial de baloncestoenvivo.feb.es.':'Altura y edad son reales (proballers.com). Foto, fecha/lugar de nacimiento, pasaporte y peso no están disponibles en las fuentes usadas para este jugador/a en esta versión — se muestran como "No disponible" en vez de inventarse. La posición se marca como "estimada" cuando no procede de una ficha oficial: se calcula a partir de la altura y el perfil de rebotes/asistencias reales del jugador.'}</div>

        <div class="stat-grid">
          <div class="stat-cell"><div class="val">${adv.pts.toFixed(1)}</div><div class="lab">Puntos${pl.real?' (real)':''}</div></div>
          <div class="stat-cell"><div class="val">${adv.trb.toFixed(1)}</div><div class="lab">Rebotes</div></div>
          <div class="stat-cell"><div class="val">${pl.ast.toFixed(1)}</div><div class="lab">Asistencias</div></div>
          <div class="stat-cell"><div class="val">${pl.stl.toFixed(1)}</div><div class="lab">Robos</div></div>
          <div class="stat-cell"><div class="val">${pl.blk.toFixed(1)}</div><div class="lab">Tapones</div></div>
        </div>

        <h4 class="section-title">Estadísticas por modo</h4>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
          <button id="statModeGame" class="btn" style="padding:9px 14px;${state.statMode==='perGame'?'border-color:var(--amber);color:var(--amber);':''}">Por partido</button>
          <button id="statModePer40" class="btn" style="padding:9px 14px;${state.statMode==='per40'?'border-color:var(--amber);color:var(--amber);':''}">Por 40 min. en pista</button>
          <button id="statModePer100" class="btn" style="padding:9px 14px;${state.statMode==='per100'?'border-color:var(--amber);color:var(--amber);':''}">Por 100 posesiones</button>
        </div>
        <div id="statModeTable">${statModeTableHTML(pl, state.statMode)}</div>

        <h4 class="section-title">Vs. media de la liga (${allPlayers.length} jugadores/as)</h4>
        <div class="adv-row"><span class="name">Puntos (media liga: ${lgAvg.pts.toFixed(1)})</span><span class="num" style="width:auto;font-family:'IBM Plex Mono',monospace;">${(adv.pts-lgAvg.pts)>=0?'+':''}${(adv.pts-lgAvg.pts).toFixed(1)}</span></div>
        <div class="adv-row"><span class="name">${metricLabel('eFG%')} (media liga: ${lgAvg.efg.toFixed(1)}%)</span><span class="num" style="width:auto;font-family:'IBM Plex Mono',monospace;">${(adv.efg-lgAvg.efg)>=0?'+':''}${(adv.efg-lgAvg.efg).toFixed(1)}</span></div>
        <div class="adv-row"><span class="name">${metricLabel('PER')} (media liga: ${lgAvg.per.toFixed(1)})</span><span class="num" style="width:auto;font-family:'IBM Plex Mono',monospace;">${(adv.per-lgAvg.per)>=0?'+':''}${(adv.per-lgAvg.per).toFixed(1)}</span></div>

        ${posAvg ? `
        <h4 class="section-title" style="margin-top:18px;">Vs. media de su posición · ${pl.pos} (${posAvg.n} jugadores/as)</h4>
        <div class="adv-row"><span class="name">Puntos (media ${pl.pos.toLowerCase()}: ${posAvg.pts.toFixed(1)})</span><span class="num" style="width:auto;font-family:'IBM Plex Mono',monospace;">${(adv.pts-posAvg.pts)>=0?'+':''}${(adv.pts-posAvg.pts).toFixed(1)}</span></div>
        <div class="adv-row"><span class="name">${metricLabel('TRB%')} (media ${pl.pos.toLowerCase()}: ${posAvg.trbPct.toFixed(1)}%)</span><span class="num" style="width:auto;font-family:'IBM Plex Mono',monospace;">${(adv.trbPct-posAvg.trbPct)>=0?'+':''}${(adv.trbPct-posAvg.trbPct).toFixed(1)}</span></div>
        <div class="adv-row"><span class="name">${metricLabel('AST%')} (media ${pl.pos.toLowerCase()}: ${posAvg.astPct.toFixed(1)}%)</span><span class="num" style="width:auto;font-family:'IBM Plex Mono',monospace;">${(adv.astPct-posAvg.astPct)>=0?'+':''}${(adv.astPct-posAvg.astPct).toFixed(1)}</span></div>
        <div class="adv-row"><span class="name">${metricLabel('PER')} (media ${pl.pos.toLowerCase()}: ${posAvg.per.toFixed(1)})</span><span class="num" style="width:auto;font-family:'IBM Plex Mono',monospace;">${(adv.per-posAvg.per)>=0?'+':''}${(adv.per-posAvg.per).toFixed(1)}</span></div>
        ` : `<div class="note">No hay suficientes jugadores/as con posición "${pl.pos}" cargados en esta liga todavía para calcular una media fiable por posición.</div>`}

        <h4 class="section-title">Diana · perfil avanzado vs. media de liga</h4>
        <div class="chart-box">
          <canvas id="radarChart"></canvas>
          <table class="pm-table" style="margin-top:14px;">
            <thead><tr><th>Eje de la diana</th><th>${pl.name.split(' ')[0]}</th><th>Media liga</th></tr></thead>
            <tbody>
              <tr><td class="pname">${metricLabel('eFG%')}</td><td>${adv.efg.toFixed(1)}%</td><td>${lgAvg.efg.toFixed(1)}%</td></tr>
              <tr><td class="pname">${metricLabel('TS%')}</td><td>${adv.ts.toFixed(1)}%</td><td>${lgAvg.ts.toFixed(1)}%</td></tr>
              <tr><td class="pname">${metricLabel('USG%')}</td><td>${adv.usg.toFixed(1)}%</td><td>${lgAvg.usg.toFixed(1)}%</td></tr>
              <tr><td class="pname">${metricLabel('AST%')}</td><td>${adv.astPct.toFixed(1)}%</td><td>${lgAvg.astPct.toFixed(1)}%</td></tr>
              <tr><td class="pname">${metricLabel('TRB%')}</td><td>${adv.trbPct.toFixed(1)}%</td><td>${lgAvg.trbPct.toFixed(1)}%</td></tr>
              <tr><td class="pname">${metricLabel('ORtg')}</td><td>${adv.ortg.toFixed(1)}</td><td>${lgAvg.ortg.toFixed(1)}</td></tr>
            </tbody>
          </table>
          <div class="note">La diana representa cada eje en una escala 0-100 para poder comparar magnitudes distintas en el mismo gráfico (por eso AST%, USG% y TRB% aparecen multiplicados x2 y ORtg dividido entre 1,4 en el dibujo); la tabla de arriba da el valor real de cada métrica sin escalar, tanto tuyo como la media de la liga.</div>
        </div>

        <h4 class="section-title">Métricas avanzadas <span style="font-weight:400;color:var(--ink-dim);font-size:11px;text-transform:none;letter-spacing:0;">(pincha el nombre para ver qué significa; entre paréntesis, la media de la liga)</span></h4>
        <div class="adv-row"><span class="name">${metricLabel('eFG%','eFG% (tiro efectivo)')} <i style="color:var(--ink-dim);font-style:normal;">(liga: ${lgAvg.efg.toFixed(1)}%)</i></span>${bar(adv.efg,65)}</div>
        <div class="adv-row"><span class="name">${metricLabel('TS%','TS% (True Shooting)')} <i style="color:var(--ink-dim);font-style:normal;">(liga: ${lgAvg.ts.toFixed(1)}%)</i></span>${bar(adv.ts,70)}</div>
        <div class="adv-row"><span class="name">${metricLabel('USG%','USG% (uso de posesiones)')} <i style="color:var(--ink-dim);font-style:normal;">(liga: ${lgAvg.usg.toFixed(1)}%)</i></span>${bar(adv.usg,38)}</div>
        <div class="adv-row"><span class="name">${metricLabel('AST%','AST% (asistencias)')} <i style="color:var(--ink-dim);font-style:normal;">(liga: ${lgAvg.astPct.toFixed(1)}%)</i></span>${bar(adv.astPct,45)}</div>
        <div class="adv-row"><span class="name">${metricLabel('TRB%','TRB% (rebote total)')} <i style="color:var(--ink-dim);font-style:normal;">(liga: ${lgAvg.trbPct.toFixed(1)}%)</i></span>${bar(adv.trbPct,35)}</div>
        <div class="adv-row"><span class="name">${metricLabel('TOV%','TOV% (pérdidas)')} <i style="color:var(--ink-dim);font-style:normal;">(liga: ${lgAvg.tovPct.toFixed(1)}%)</i></span>${bar(adv.tovPct,30)}</div>
        <div class="adv-row"><span class="name">${metricLabel('ORtg','ORtg (ofensivo /100 pos.)')} <i style="color:var(--ink-dim);font-style:normal;">(liga: ${lgAvg.ortg.toFixed(1)})</i></span>${bar(adv.ortg,140)}</div>
        <div class="adv-row"><span class="name">${metricLabel('DRtg','DRtg (defensivo /100 pos., aprox.)')} <i style="color:var(--ink-dim);font-style:normal;">(liga: ${lgAvg.drtg.toFixed(1)})</i></span>${bar(adv.drtg,140)}</div>
        <div class="adv-row"><span class="name">${metricLabel('Net Rating')}</span><span class="num" style="width:auto;font-family:'IBM Plex Mono',monospace;">${adv.netrtg>=0?'+':''}${adv.netrtg.toFixed(1)}</span></div>
        <div class="adv-row"><span class="name">${metricLabel('PER','PER (simplificado)')} <i style="color:var(--ink-dim);font-style:normal;">(liga: ${lgAvg.per.toFixed(1)})</i></span><span class="num" style="width:auto;font-family:'IBM Plex Mono',monospace;">${adv.per.toFixed(1)}</span></div>

        <h4 class="section-title" style="margin-top:20px;">Producción por partido</h4>
        <div class="chart-box">
          <canvas id="barChart"></canvas>
          <table class="pm-table" style="margin-top:14px;">
            <thead><tr><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>TOV</th></tr></thead>
            <tbody><tr><td>${adv.pts.toFixed(1)}</td><td>${adv.trb.toFixed(1)}</td><td>${pl.ast.toFixed(1)}</td><td>${pl.stl.toFixed(1)}</td><td>${pl.blk.toFixed(1)}</td><td>${pl.tov.toFixed(1)}</td></tr></tbody>
          </table>
        </div>

        <div class="note ${pl.real?'confirmed':''}"><b>${pl.real?'Dato real:':'Nota:'}</b> ${pl.real?`Los puntos por partido (${adv.pts.toFixed(1)}) proceden del ranking oficial de baloncestoenvivo.feb.es.`:''} eFG%, TS%, USG%, ORtg/DRtg, Net Rating, PER, AST%, TRB% y TOV% son cálculos con fórmulas estándar de baloncesto avanzado (Basketball-Reference/Dean Oliver) aplicadas sobre el perfil de caja de este jugador/a; DRtg y PER usan una versión simplificada al no disponer de estadística de equipo rival y de posesión detallada por jugador.</div>
      </div>
    `;
    div.appendChild(sheet);

    setTimeout(()=>{
      const btnGame=document.getElementById('statModeGame');
      const btn40=document.getElementById('statModePer40');
      const btn100=document.getElementById('statModePer100');
      const setModeBtnStyle=()=>{
        [btnGame,btn40,btn100].forEach(b=>{ if(b){ b.style.borderColor='var(--line)'; b.style.color='var(--ink)'; } });
        const active = state.statMode==='perGame'?btnGame:state.statMode==='per40'?btn40:btn100;
        if(active){ active.style.borderColor='var(--amber)'; active.style.color='var(--amber)'; }
      };
      const refreshTable=()=>{
        const tbl=document.getElementById('statModeTable');
        if(tbl) tbl.innerHTML = statModeTableHTML(pl, state.statMode);
        setModeBtnStyle();
      };
      if(btnGame) btnGame.onclick=()=>{ state.statMode='perGame'; refreshTable(); };
      if(btn40) btn40.onclick=()=>{ state.statMode='per40'; refreshTable(); };
      if(btn100) btn100.onclick=()=>{ state.statMode='per100'; refreshTable(); };
    },0);

    setTimeout(()=>{
      const radarCtx=document.getElementById('radarChart');
      chartRefs.push(new Chart(radarCtx,{
        type:'radar',
        data:{
          labels:['eFG%','TS%','USG%','AST%','TRB%','ORtg/1.4'],
          datasets:[
            {label:pl.name.split(' ')[0], data:[adv.efg,adv.ts,adv.usg*2,adv.astPct*2,adv.trbPct*2,adv.ortg/1.4], backgroundColor:'rgba(242,169,59,.28)', borderColor:'#F2A93B', pointBackgroundColor:'#F2A93B'},
            {label:'Media liga', data:[lgAvg.efg,lgAvg.ts,lgAvg.usg*2,lgAvg.astPct*2,lgAvg.trbPct*2,lgAvg.ortg/1.4], backgroundColor:'rgba(54,201,176,.15)', borderColor:'#36C9B0', pointBackgroundColor:'#36C9B0'}
          ]
        },
        options:{responsive:true, scales:{r:{angleLines:{color:'#2A3140'},grid:{color:'#2A3140'},pointLabels:{color:'#ECEFF4',font:{size:11}},ticks:{color:'#8B93A1',backdropColor:'transparent',stepSize:20},min:0,max:100}}, plugins:{legend:{labels:{color:'#8B93A1'}}}}
      }));
      const barCtx=document.getElementById('barChart');
      chartRefs.push(new Chart(barCtx,{
        type:'bar',
        data:{labels:['PTS','REB','AST','STL','BLK','TOV'],
          datasets:[{label:pl.name.split(' ')[0], data:[adv.pts,adv.trb,pl.ast,pl.stl,pl.blk,pl.tov], backgroundColor:['#F2A93B','#36C9B0','#36C9B0','#8B93A1','#8B93A1','#D6483F']}]},
        options:{responsive:true, plugins:{legend:{display:false}}, scales:{x:{ticks:{color:'#8B93A1'},grid:{color:'#1D2330'}}, y:{ticks:{color:'#8B93A1'},grid:{color:'#1D2330'}}}}
      }));
    },0);

  } else {
    const {team,league}=state.entity.data;
    const sheet=document.createElement('div'); sheet.className='sheet';
    const ff=team.ff;
    const poss = getPoss(team.name);
    const leagueTeamsWithPoss = league.teams.filter(t=>getPoss(t.name)!==null);
    const leagueAvgPoss = leagueTeamsWithPoss.length ? leagueTeamsWithPoss.reduce((s,t)=>s+getPoss(t.name),0)/leagueTeamsWithPoss.length : null;
    const roster = league.players.filter(p=>p.team===team.name);
    const hasRealGame = team.name==='Spar Girona' || team.name==='Valencia B.C.';
    const teamLogoUrl = teamLogo(team.name);
    sheet.innerHTML=`
      <div class="sheet-head">
        <div class="sheet-head-top">
          <div style="display:flex;align-items:center;gap:14px;">
            ${teamLogoUrl?`<img src="${teamLogoUrl}" alt="" data-team="${team.name}" onerror="this.onerror=null;teamLogoFail(this)"\\'")}',56).replace(/<img[^>]*>/,'')" style="width:56px;height:56px;object-fit:contain;flex-shrink:0;background:rgba(255,255,255,.06);border-radius:8px;padding:4px;">`:teamBadgeHTML(team.name,56)}
            <div>
              <div class="sheet-eyebrow">${league.name}</div>
              <div class="sheet-name">${team.name}</div>
            </div>
          </div>
          <button class="pdf-btn no-print" onclick="window.print()">📄 Descargar PDF</button>
        </div>
        <div class="sheet-meta">${league.sub}${ff?` · ${ff.games} partidos`:''}</div>
      </div>
      <div class="sheet-body">
        ${ff ? `
          <div class="stat-grid">
            <div class="stat-cell"><div class="val">${ff.pts.toFixed(1)}</div><div class="lab">Puntos/partido</div></div>
            ${ff.ast!==undefined?`<div class="stat-cell"><div class="val">${ff.ast.toFixed(1)}</div><div class="lab">Asist./partido</div></div>`:''}
            ${ff.treb!==undefined?`<div class="stat-cell"><div class="val">${ff.treb.toFixed(1)}</div><div class="lab">Rebotes/partido</div></div>`:''}
            ${poss?`<div class="stat-cell"><div class="val">${poss.toFixed(1)}</div><div class="lab">Posesiones/partido</div></div>`:''}
            <div class="stat-cell"><div class="val">${ff.games}</div><div class="lab">Partidos</div></div>
          </div>
          ${teamGameHTML(team, roster)}
          <h4 class="section-title">4 Factores de Dean Oliver</h4>
          <div class="chart-box"><canvas id="ffBarChart"></canvas></div>
          <div class="adv-row"><span class="name">eFG% — tiro efectivo</span>${bar(ff.efg,65)}</div>
          <div class="adv-row"><span class="name">TOV% — pérdidas por posesión</span>${bar(ff.tov,30)}</div>
          <div class="adv-row"><span class="name">ORB%* — rebote ofensivo propio</span>${bar(ff.orb,45)}</div>
          <div class="adv-row"><span class="name">FT Rate — tiros libres/tiros de campo</span>${bar(ff.ftr,45)}</div>
          <div class="note confirmed"><b>Dato real:</b> los 4 Factores están calculados directamente sobre las medias oficiales de equipo publicadas en ${state.season==='2026-2027'?'feb.es (totales de la Jornada 1 2026/27)':'baloncestoenvivo.feb.es (temporada 2025/26)'}. *ORB% es una tasa de rebote ofensivo propio (no ajustada al rival, por no estar publicada esa granularidad).</div>

          ${poss?`
          <h4 class="section-title" style="margin-top:20px;">Posesiones, ritmo y rendimiento por cada 5 minutos</h4>
          <div class="adv-row"><span class="name">Ritmo (posesiones/partido, 40 min)${leagueAvgPoss?` <i style="color:var(--ink-dim);font-style:normal;">(media liga: ${leagueAvgPoss.toFixed(1)})</i>`:''}</span>${bar(poss,90)}</div>
          <div class="adv-row"><span class="name">Puntos por cada 5 min de juego</span>${bar(ff.pts/8,14)}</div>
          ${ff.ast!==undefined?`<div class="adv-row"><span class="name">Asistencias por cada 5 min</span>${bar(ff.ast/8,3)}</div>`:''}
          ${ff.treb!==undefined?`<div class="adv-row"><span class="name">Rebotes por cada 5 min</span>${bar(ff.treb/8,5)}</div>`:''}
          ${leagueAvgPoss?`<div class="note confirmed"><b>Media de la liga:</b> ${leagueAvgPoss.toFixed(1)} posesiones/partido, calculada sobre los ${leagueTeamsWithPoss.length} equipos de ${league.name} con datos confirmados. Este equipo juega ${poss>=leagueAvgPoss?'más rápido':'más despacio'} que la media (${(poss-leagueAvgPoss>=0?'+':'')}${(poss-leagueAvgPoss).toFixed(1)} posesiones).</div>`:''}
          <div class="note confirmed"><b>Dato real (calculado):</b> posesiones estimadas con la fórmula estándar Poss ≈ TCA − RO + BP + 0,44×TLA aplicada a las medias oficiales de equipo; el rendimiento "por cada 5 minutos" es ese mismo dato real repartido entre los 8 tramos de 5 minutos que tiene un partido de 40 minutos.</div>
          `:''}

          <h4 class="section-title" style="margin-top:20px;">Distribución de minutos · ${state.season==='2026-2027'?'temporada 2026/27 (Jornada 1)':'temporada 2025/26'}</h4>
          ${minutesChartHTML(roster)}

          <h4 class="section-title" style="margin-top:20px;">Quintetos · eficiencia por combinación de 5<span class="illustrative-tag">Ilustrativo</span></h4>
          ${lineupsHTML(team.name, roster)}
        ` : `<div class="note">Todavía no hay datos oficiales de equipo confirmados para este club en esta versión de la app. El club en sí es real y forma parte de la competición ${league.name} 2025/26 según feb.es.</div>`}

        ${hasRealGame ? `
          <h4 class="section-title" style="margin-top:20px;">Partido real analizado · impacto por jugadora (+/-)</h4>
          ${realGameHTML(REAL_GAME_LFENDESA, team.name)}
        ` : ''}
      </div>
    `;
    div.appendChild(sheet);

    if(ff){
      setTimeout(()=>{
        const ctx=document.getElementById('ffBarChart');
        const avgFFteam = leagueAvgFFComputed(league.teams) || {efg:0,tov:0,orb:0,ftr:0};
        chartRefs.push(new Chart(ctx,{
          type:'bar',
          data:{labels:['eFG%','TOV%','ORB%*','FT Rate'],
            datasets:[
              {label:team.name.split(' ')[0], data:[ff.efg,ff.tov,ff.orb,ff.ftr], backgroundColor:'#F2A93B'},
              {label:'Media liga', data:[avgFFteam.efg,avgFFteam.tov,avgFFteam.orb,avgFFteam.ftr], backgroundColor:'#36C9B0'}
            ]},
          options:{responsive:true, plugins:{legend:{labels:{color:'#8B93A1'}}}, scales:{x:{ticks:{color:'#8B93A1'},grid:{color:'#1D2330'}}, y:{ticks:{color:'#8B93A1'},grid:{color:'#1D2330'}}}}
        }));
      },0);
    }
    if(roster.length){
      setTimeout(()=>{
        const minCtx=document.getElementById('minutesChart');
        if(minCtx){
          const sorted=[...roster].filter(p=>p.min).sort((a,b)=>b.min-a.min);
          chartRefs.push(new Chart(minCtx,{
            type:'bar',
            data:{
              labels: sorted.map(p=>p.name),
              datasets:[{
                label:'Minutos/partido',
                data: sorted.map(p=>p.min),
                backgroundColor: sorted.map(p=>minutesColor(p.min))
              }]
            },
            options:{
              responsive:true, maintainAspectRatio:false,
              plugins:{legend:{display:false}, tooltip:{callbacks:{label:(c)=>c.parsed.y.toFixed(1)+' min/partido'}}},
              scales:{
                x:{ticks:{color:'#ECEFF4',font:{size:10},autoSkip:false,maxRotation:80,minRotation:60},grid:{display:false}},
                y:{ticks:{color:'#8B93A1'},grid:{color:'#1D2330'}, title:{display:true,text:'Minutos por partido',color:'#8B93A1'}}
              }
            }
          }));
        }
      },0);
    }
    if(hasRealGame){
      setTimeout(()=>{
        const g=REAL_GAME_LFENDESA;
        const ctx=document.getElementById('quarterChart');
        if(ctx){
          const diff = g.home.quarters.map((q,i)=>q-g.away.quarters[i]);
          chartRefs.push(new Chart(ctx,{
            type:'bar',
            data:{labels:['C1','C2','C3','C4'],
              datasets:[{label:`Diferencia ${g.home.name} - ${g.away.name} por cuarto`, data:diff, backgroundColor:diff.map(d=>d>=0?'#36C9B0':'#D6483F')}]},
            options:{responsive:true, plugins:{legend:{labels:{color:'#8B93A1'}}}, scales:{x:{ticks:{color:'#8B93A1'},grid:{color:'#1D2330'}}, y:{ticks:{color:'#8B93A1'},grid:{color:'#1D2330'}}}}
          }));
        }
      },0);
    }
  }
  return div;
}

render();
</script>
</body>
</html>
